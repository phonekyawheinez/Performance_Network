[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processor-interconnect-simulator"
version = "2.0.0"
description = "Educational simulator comparing 2D Mesh and Hypercube processor interconnection networks"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=6.0",
  "streamlit>=1.31",
]

[tool.setuptools.packages.find]
include = ["interconnect*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
